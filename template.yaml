AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hello MCP Server on AWS Lambda

Parameters:
  BearerToken:
    Type: String
    Description: Bearer token for API authentication
    Default: "mcp-secret-token-12345"
    NoEcho: true

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 512
    Environment:
      Variables:
        NODE_ENV: production
        BEARER_TOKEN: !Ref BearerToken

Resources:
  MCPServerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hello-mcp-server
      Handler: dist/lambda.handler
      CodeUri: ./
      Description: Hello MCP Server with Bearer Token Authentication
      Events:
        HttpApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        HttpApiProxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  FunctionArn:
    Description: "Lambda Function ARN"
    Value: !GetAtt MCPServerFunction.Arn
